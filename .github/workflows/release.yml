name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set version number"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/pool_heat_pump_iphcr45_modbus/manifest.json"
      # Pack the HACS dir as a zip and upload to the release
      - name: ZIP Pool Heat Pump IPHCR45 Dir
        run: |
          cd "${{ github.workspace }}/custom_components/pool_heat_pump_iphcr45_modbus"
          zip pool_heat_pump_iphcr45_modbus.zip -r ./
      - name: Upload zip to release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ${{ github.workspace }}/custom_components/pool_heat_pump_iphcr45_modbus/pool_heat_pump_iphcr45_modbus.zip
